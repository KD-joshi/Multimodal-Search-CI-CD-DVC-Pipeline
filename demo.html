<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimodal Fashion Search</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #FAFAF8;
            --text-main: #111827;
            --text-muted: #6B7280;
            --accent-primary: #FF5A00;
            --accent-secondary: #3B82F6;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border-light: rgba(0, 0, 0, 0.08);
            --font-body: 'Inter', sans-serif;
            --font-display: 'Playfair Display', serif;
            --font-mono: 'Space Mono', monospace;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #FDFCFB 0%, #E2D1C3 100%);
            color: var(--text-main);
            padding: 60px 20px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .blob {
            position: fixed; border-radius: 50%; z-index: -1; opacity: 0.8;
            animation: float 20s infinite ease-in-out alternate; will-change: transform;
        }
        .blob-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(255, 90, 0, 0.12) 0%, rgba(255, 90, 0, 0) 70%);
            top: -150px; left: -150px;
        }
        .blob-2 {
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, rgba(59, 130, 246, 0) 70%);
            bottom: -250px; right: -150px; animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
            100% { transform: translate(-30px, 50px) scale(0.9); }
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 50px; }
        h1 {
            font-family: var(--font-display); font-size: 2.8rem; font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #111827 0%, var(--accent-primary) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }
        .header p {
            color: var(--text-muted); font-size: 1.1rem; font-weight: 500;
            max-width: 600px; margin: 0 auto;
        }

        /* Mode tabs */
        .mode-tabs {
            display: flex; justify-content: center; gap: 0; margin-bottom: 30px;
        }
        .mode-tab {
            padding: 12px 30px; font-family: var(--font-mono); font-size: 0.85rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; border: 2px solid rgba(0,0,0,0.1); background: rgba(255,255,255,0.5);
            color: var(--text-muted); transition: all 0.3s ease;
        }
        .mode-tab:first-child { border-radius: 50px 0 0 50px; }
        .mode-tab:last-child { border-radius: 0 50px 50px 0; }
        .mode-tab.active {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #FF8A00 100%);
            color: #fff; border-color: var(--accent-primary);
            box-shadow: 0 5px 15px rgba(255, 90, 0, 0.3);
        }

        /* Search panels */
        .search-panel {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 90, 0, 0.3); border-radius: 24px;
            padding: 25px; margin-bottom: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            display: none;
        }
        .search-panel.active { display: block; }

        .search-row {
            display: flex; gap: 12px; align-items: center;
        }

        input, select {
            padding: 14px 20px; border-radius: 50px;
            border: 1px solid rgba(255, 90, 0, 0.3);
            font-family: var(--font-body); font-size: 1rem;
            outline: none; transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.5); color: var(--text-main);
        }
        input { flex: 1; min-width: 200px; font-weight: 500; }
        input:focus, select:focus {
            background: #fff; border-color: rgba(255, 90, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 90, 0, 0.1);
        }

        button {
            background: linear-gradient(135deg, var(--accent-primary) 0%, #FF8A00 100%);
            color: #fff; font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            border-radius: 50px; border: none; padding: 14px 30px;
            box-shadow: 0 10px 20px rgba(255, 90, 0, 0.3); transition: all 0.3s ease;
            white-space: nowrap;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(255, 90, 0, 0.4); }

        .image-url-note {
            font-size: 0.82rem; color: var(--text-muted); margin-top: 10px;
            font-style: italic; padding-left: 20px;
        }

        /* Results */
        .results-section { display: none; }
        .section-title {
            font-family: var(--font-display); font-size: 1.8rem; margin: 40px 0 25px 0;
            color: var(--text-main); display: flex; align-items: center; gap: 15px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), transparent);
        }

        .results-meta {
            display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap;
        }
        .meta-chip {
            background: rgba(255,255,255,0.7); border: 1px solid var(--border-light);
            padding: 8px 16px; border-radius: 50px; font-family: var(--font-mono);
            font-size: 0.8rem; font-weight: 700; color: var(--text-muted);
        }
        .meta-chip span { color: var(--accent-primary); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 20px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); position: relative;
        }
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-color: rgba(255, 90, 0, 0.3);
        }
        .card-img-container {
            width: 100%; height: 260px; background: #fff; overflow: hidden;
            display: flex; align-items: center; justify-content: center; padding: 15px;
        }
        .card img {
            width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s ease;
        }
        .card:hover img { transform: scale(1.08); }
        .card-content {
            padding: 20px; display: flex; flex-direction: column; flex-grow: 1;
        }
        .brand {
            font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--accent-primary); margin-bottom: 8px; font-weight: 700;
        }
        .title {
            font-weight: 600; font-size: 1.05rem; margin-bottom: 15px; line-height: 1.5;
            color: var(--text-main);
        }
        .meta {
            margin-top: auto; display: flex; justify-content: space-between;
            align-items: center; padding-top: 12px;
        }
        .price { font-family: var(--font-mono); font-weight: 700; font-size: 1.1rem; color: #10B981; }
        .score-badge {
            background: rgba(255, 90, 0, 0.1); padding: 5px 12px; border-radius: 50px;
            font-family: var(--font-mono); font-size: 0.75rem; font-weight: 700;
            color: var(--accent-primary); border: 1px solid rgba(255, 90, 0, 0.2);
        }
        .rank-badge {
            position: absolute; top: 12px; left: 12px;
            background: var(--accent-primary); color: #fff; width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-family: var(--font-mono); font-weight: 700; font-size: 0.85rem;
            box-shadow: 0 4px 10px rgba(255, 90, 0, 0.3);
        }

        .loading {
            display: none; text-align: center; font-family: var(--font-mono);
            font-size: 1rem; color: var(--accent-primary); margin: 50px 0;
            text-transform: uppercase; letter-spacing: 2px; font-weight: 700;
        }
        .loading::after { content: ''; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots {
            0%, 20% { content: '.'; } 40% { content: '..'; }
            60% { content: '...'; } 80%, 100% { content: ''; }
        }
    </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="container">
    <div class="header">
        <h1>Multimodal Fashion Search</h1>
        <p>Search by text or image. Powered by Sentence-BERT, FashionCLIP, BM25, and Cross-Encoder re-ranking.</p>
    </div>

    <!-- Mode tabs -->
    <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('text')">Text Search</div>
        <div class="mode-tab" onclick="switchMode('image')">Image Search</div>
        <div class="mode-tab" onclick="switchMode('uid')">Product ID</div>
    </div>

    <!-- Text search panel -->
    <div id="panel-text" class="search-panel active">
        <div class="search-row">
            <input type="text" id="text-query" placeholder='Try: "men casual shirt blue" or "women summer dress"'>
            <select id="text-topk">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="20">Top 20</option>
            </select>
            <button onclick="searchText()">Search</button>
        </div>
    </div>

    <!-- Image search panel -->
    <div id="panel-image" class="search-panel">
        <div class="search-row">
            <input type="text" id="image-url" placeholder="Paste an image URL...">
            <select id="image-topk">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="20">Top 20</option>
            </select>
            <button onclick="searchImage()">Search</button>
        </div>
        <div class="image-url-note">Paste any product image URL. The image will be downloaded and encoded through FashionCLIP.</div>
    </div>

    <!-- Product ID panel (legacy) -->
    <div id="panel-uid" class="search-panel">
        <div class="search-row">
            <input type="text" id="uid" placeholder="Enter Product UID..." value="ad8a5a196d515ef09dfdaf082bdc37c4">
            <select id="uid-mode">
                <option value="combined">Combined</option>
                <option value="image">Image (CLIP)</option>
                <option value="text_structured">Text (SBERT)</option>
            </select>
            <select id="uid-topk">
                <option value="5">Top 5</option>
                <option value="10" selected>Top 10</option>
                <option value="20">Top 20</option>
            </select>
            <button onclick="searchUID()">Search</button>
        </div>
    </div>

    <div id="loading" class="loading">Searching</div>

    <div id="resultsArea" class="results-section">
        <div id="resultsMeta" class="results-meta"></div>
        <div class="section-title">Results</div>
        <div id="resultsGrid" class="grid"></div>
    </div>
</div>

<script>
    // Mode switching
    function switchMode(mode) {
        document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.search-panel').forEach(p => p.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('panel-' + mode).classList.add('active');
    }

    // Enter key handlers
    document.getElementById('text-query').addEventListener('keypress', e => { if (e.key === 'Enter') searchText(); });
    document.getElementById('image-url').addEventListener('keypress', e => { if (e.key === 'Enter') searchImage(); });
    document.getElementById('uid').addEventListener('keypress', e => { if (e.key === 'Enter') searchUID(); });

    function showLoading() {
        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultsArea').style.display = 'none';
    }
    function hideLoading() {
        document.getElementById('loading').style.display = 'none';
    }

    // TEXT SEARCH
    async function searchText() {
        const query = document.getElementById('text-query').value.trim();
        const topk = document.getElementById('text-topk').value;
        if (!query) return alert('Enter a search query');

        showLoading();
        try {
            const res = await fetch('/search/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query, top_k: parseInt(topk) })
            });
            const data = await res.json();
            if (res.status !== 200) throw new Error(data.detail || 'Server error');

            renderMeta(`Text: "${query}"`, data.latency_ms, data.results.length);
            renderResults(data.results);
        } catch (err) {
            hideLoading(); alert('Error: ' + err.message);
        }
    }

    // IMAGE SEARCH (via URL — download on backend)
    async function searchImage() {
        const imageUrl = document.getElementById('image-url').value.trim();
        const topk = document.getElementById('image-topk').value;
        if (!imageUrl) return alert('Paste an image URL');

        showLoading();
        try {
            // Download the image client-side, then upload as multipart
            const imgRes = await fetch(imageUrl);
            const blob = await imgRes.blob();
            
            const formData = new FormData();
            formData.append('file', blob, 'query.jpg');
            formData.append('top_k', topk);
            
            const res = await fetch('/search/image', { method: 'POST', body: formData });
            const data = await res.json();
            if (res.status !== 200) throw new Error(data.detail || 'Server error');

            renderMeta(`Image search`, data.latency_ms, data.results.length);
            renderResults(data.results);
        } catch (err) {
            hideLoading(); alert('Error: ' + err.message + '. The image URL may be blocked by CORS.');
        }
    }

    // PRODUCT ID SEARCH (legacy)
    async function searchUID() {
        const uid = document.getElementById('uid').value.trim();
        const mode = document.getElementById('uid-mode').value;
        const topk = document.getElementById('uid-topk').value;
        if (!uid) return alert('Enter a Product UID');

        showLoading();
        try {
            const res = await fetch(`/find_similar_products_detailed?product_id=${uid}&num_similar=${topk}&mode=${mode}`);
            const data = await res.json();
            if (res.status !== 200) throw new Error(data.detail || 'Server error');

            renderMeta(`Product ID: ${uid.slice(0,12)}... (${mode})`, null, data.similar_products.length);
            renderResults(data.similar_products.map(p => ({
                ...p, score: p.similarity_score
            })));
        } catch (err) {
            hideLoading(); alert('Error: ' + err.message);
        }
    }

    function renderMeta(queryDesc, latencyMs, count) {
        const meta = document.getElementById('resultsMeta');
        let chips = `<div class="meta-chip">Query: <span>${queryDesc}</span></div>`;
        chips += `<div class="meta-chip">Results: <span>${count}</span></div>`;
        if (latencyMs !== null && latencyMs !== undefined) {
            chips += `<div class="meta-chip">Latency: <span>${latencyMs.toFixed(1)}ms</span></div>`;
        }
        meta.innerHTML = chips;
    }

    function renderResults(products) {
        const grid = document.getElementById('resultsGrid');
        grid.innerHTML = products.map((p, i) => {
            const price = p.sales_price ? `₹${p.sales_price}` : '';
            const img = p.image_url || 'https://via.placeholder.com/400x400?text=No+Image';
            const score = p.score !== undefined && p.score !== null ? p.score.toFixed(4) : '';
            const scoreHtml = score ? `<div class="score-badge">${score}</div>` : '';
            const rank = i + 1;
            return `
                <div class="card">
                    <div class="rank-badge">${rank}</div>
                    <div class="card-img-container">
                        <img src="${img}" alt="Product" onerror="this.src='https://via.placeholder.com/400x400?text=Broken+Link'">
                    </div>
                    <div class="card-content">
                        <div class="brand">${p.brand || 'Unknown'}</div>
                        <div class="title">${p.product_name || 'No Title'}</div>
                        <div class="meta">
                            <div class="price">${price}</div>
                            ${scoreHtml}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        hideLoading();
        document.getElementById('resultsArea').style.display = 'block';
    }
</script>

</body>
</html>

name: Automated MLOps Retraining Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # Run at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-mlops-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: pip install kaggle

      - name: Trigger MLOps Notebook execution
        env:
          SECRET_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # Foolproof Python script to generate the kaggle.json file correctly
          python -c "
          import os, json
          token_str = os.environ.get('SECRET_TOKEN', '')
          try:
              token = json.loads(token_str)
          except Exception:
              token = {'username': 'kuldeepjoshi2941', 'key': token_str.strip()}
          os.makedirs(os.path.expanduser('~/.kaggle'), exist_ok=True)
          with open(os.path.expanduser('~/.kaggle/kaggle.json'), 'w') as f:
              json.dump(token, f)
          "
          chmod 600 ~/.kaggle/kaggle.json
          
          # This triggers the execution of the Drift & Retraining notebook headlessly on Kaggle's free GPUs
          echo "Triggering remote execution of drift_retraining.ipynb..."
          cd kaggle_mlops
          kaggle kernels push -p ./
          echo "Pipeline Triggered Successfully!"

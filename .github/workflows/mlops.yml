name: Automated MLOps Retraining Pipeline

on:
  push:
    branches:
      - main
  schedule:
    # Run at 00:00 every Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  run-mlops-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Kaggle API
        run: pip install kaggle

      - name: Trigger MLOps Notebook execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          # The modern Kaggle API requires the KGAT token to be saved as access_token
          mkdir -p ~/.kaggle
          echo "$KAGGLE_API_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          
          # This triggers the execution of the Drift & Retraining notebook headlessly on Kaggle's free GPUs
          echo "Triggering remote execution of drift_retraining.ipynb..."
          cd kaggle_mlops
          kaggle kernels push -p ./
          echo "Pipeline Triggered Successfully!"
